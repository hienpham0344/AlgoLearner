name: Tính năng Frontend
description: Màn hình, tương tác, kết nối API và khả năng tiếp cận.
title: '[FE][4.x] '
labels:
- enhancement
- frontend
body:
- type: markdown
  attributes:
    value: Chọn milestone tuần và label `srs:4.x` ở thanh bên. Đối chiếu SRS trước khi triển khai; ghi rõ các mâu
      thuẫn hoặc quyết định chưa chốt. Không đưa mật khẩu, OTP, token, nội dung .env hoặc dữ liệu cá nhân vào issue.
- type: dropdown
  id: module
  attributes:
    label: Phân hệ SRS
    options:
    - 4.1 - Tài khoản và xác thực
    - 4.2 - Hồ sơ và dashboard
    - 4.3 - Quản lý lớp học
    - 4.4 - Thông báo lớp học
    - 4.5 - Bài học trong lớp
    - 4.6 - Bài tập
    - 4.7 - Quiz trong lớp
    - 4.8 - Luyện tập code trong lớp
    - 4.9 - Code Judge
    - 4.10 - Sổ điểm và đánh giá
    - 4.11 - Khóa học công khai
    - 4.12 - Luyện tập công khai
    - 4.13 - Thông báo trong ứng dụng
    - 4.14 - Quản trị hệ thống
    - 4.15 - Báo cáo và xuất dữ liệu
    - 4.16 - Audit và logging
    - Liên phân hệ / hạ tầng
  validations:
    required: true
- type: textarea
  id: references
  attributes:
    label: Truy vết yêu cầu
    description: Ghi mục SRS, các mã FR/BR/UC/TC chính xác và liên kết tài liệu; không tự tạo mã yêu cầu.
    placeholder: SRS 4.x; FR-...; BR-...; UC-...; TC-...
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: Màn hình và luồng người dùng
    description: Nêu vai trò, các màn hình, đường dẫn và liên kết thiết kế nếu có.
  validations:
    required: true
- type: textarea
  id: contract
  attributes:
    label: Tích hợp API và trạng thái giao diện
    description: Endpoint/DTO; loading, empty, error, success; 401/403; TypeScript strict, ApiResponse<T>, TanStack
      Query key factory; hiển thị UTC+7.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Tiêu chí nghiệm thu
    description: Viết điều kiện quan sát được, gồm luồng thành công, lỗi và phân quyền.
    placeholder: '- [ ] ...

      - [ ] ...'
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: Phụ thuộc và công việc liên quan
    description: Liên kết issues/PR; chỉ rõ phụ thuộc bắt buộc và điều kiện hoàn thành.
    placeholder: 'Depends on #...; liên quan PR #...; quyết định cần chốt: ...'
  validations:
    required: false
- type: textarea
  id: verification
  attributes:
    label: Kế hoạch kiểm thử và bằng chứng
    description: Nêu test case, môi trường và kiểm tra cần chạy. Chỉ ghi Pass khi đã quan sát kết quả.
    placeholder: '- [ ] Kiểm thử luồng chính / lỗi / phân quyền

      - [ ] Tích hợp API và dữ liệu thật

      - [ ] Ghi build, kết quả và bằng chứng vào PR/Test Report'
  validations:
    required: true
