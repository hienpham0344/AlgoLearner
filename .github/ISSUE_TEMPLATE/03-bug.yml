name: Báo lỗi
description: Lỗi có thể tái hiện, kết quả mong đợi và bằng chứng.
title: '[BUG][4.x] '
labels:
- bug
body:
- type: markdown
  attributes:
    value: Chọn milestone tuần và label `srs:4.x` ở thanh bên. Đối chiếu SRS trước khi triển khai; ghi rõ các mâu
      thuẫn hoặc quyết định chưa chốt. Không đưa mật khẩu, OTP, token, nội dung .env hoặc dữ liệu cá nhân vào issue.
- type: dropdown
  id: module
  attributes:
    label: Phân hệ SRS
    options:
    - 4.1 - Tài khoản và xác thực
    - 4.2 - Hồ sơ và dashboard
    - 4.3 - Quản lý lớp học
    - 4.4 - Thông báo lớp học
    - 4.5 - Bài học trong lớp
    - 4.6 - Bài tập
    - 4.7 - Quiz trong lớp
    - 4.8 - Luyện tập code trong lớp
    - 4.9 - Code Judge
    - 4.10 - Sổ điểm và đánh giá
    - 4.11 - Khóa học công khai
    - 4.12 - Luyện tập công khai
    - 4.13 - Thông báo trong ứng dụng
    - 4.14 - Quản trị hệ thống
    - 4.15 - Báo cáo và xuất dữ liệu
    - 4.16 - Audit và logging
    - Liên phân hệ / hạ tầng
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: Phạm vi kỹ thuật
    options:
    - Backend
    - Frontend
    - Backend và Frontend
    - Database
    - Tài liệu / kiểm thử / hạ tầng
  validations:
    required: true
- type: input
  id: environment
  attributes:
    label: Môi trường / build
    description: URL môi trường, commit hoặc phiên bản, trình duyệt/runtime; không chứa thông tin xác thực.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Các bước tái hiện
    placeholder: '1. ...

      2. ...

      3. ...'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Kết quả mong đợi
    description: Dẫn mã FR/BR/UC hoặc tiêu chí nghiệm thu liên quan.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Kết quả thực tế và ảnh hưởng
  validations:
    required: true
- type: dropdown
  id: frequency
  attributes:
    label: Tần suất
    options:
    - Luôn xảy ra
    - Thỉnh thoảng
    - Chưa xác định
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Bằng chứng đã loại thông tin nhạy cảm
    description: Ảnh, lỗi rút gọn, request ID hoặc log đã che dữ liệu nhạy cảm.
  validations:
    required: false
- type: textarea
  id: dependencies
  attributes:
    label: Phụ thuộc và công việc liên quan
    description: Liên kết issues/PR; chỉ rõ phụ thuộc bắt buộc và điều kiện hoàn thành.
    placeholder: 'Depends on #...; liên quan PR #...; quyết định cần chốt: ...'
  validations:
    required: false
