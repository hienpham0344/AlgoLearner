name: Reviewer Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: reviewer-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reviewer-gate:
    name: Reviewer Gate policy evaluation
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Mark the PR HEAD pending before any checkout/test/API call; prevent stale success.
      - name: Mark reviewer gate pending
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.payload.pull_request.head.sha,
              state: 'pending', context: 'reviewer-gate',
              description: 'Review requirements are being re-evaluated.',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });
      # Only checkout trusted base-branch code; never execute code from the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Run gate regression tests
        run: node --test .github/scripts/reviewer-gate.test.cjs
      - name: Evaluate reviewers and publish HEAD commit status
        uses: actions/github-script@v7
        with:
          script: |
            const {evaluateReviewerGate} = require('./.github/scripts/reviewer-gate.cjs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const statusContext = 'reviewer-gate';
            const statusUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const setStatus = async (sha, state, description) => github.rest.repos.createCommitStatus({
              owner, repo, sha, state, context: statusContext,
              description: description.slice(0, 140), target_url: statusUrl
            });
            // Fail closed on API errors: overwrite any previous green status first.
            await setStatus(context.payload.pull_request.head.sha, 'pending', 'Evaluating reviewer requirements.');
            const {data: pull} = await github.rest.pulls.get({owner, repo, pull_number});
            await setStatus(pull.head.sha, 'pending', 'Evaluating reviewer requirements.');
            const [timeline, reviews] = await Promise.all([
              github.paginate(github.rest.issues.listEventsForTimeline, {owner, repo, issue_number: pull_number, per_page: 100}),
              github.paginate(github.rest.pulls.listReviews, {owner, repo, pull_number, per_page: 100})
            ]);
            const decision = evaluateReviewerGate({pull, timeline, reviews});
            await setStatus(pull.head.sha, decision.ok ? 'success' : 'failure', decision.reason);
            core.info(decision.reason);
            if (!decision.ok) core.setFailed(decision.reason);
