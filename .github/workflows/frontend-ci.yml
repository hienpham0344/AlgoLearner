name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Tests, build and Playwright (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Detect frontend changes
        id: changes
        working-directory: .
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$CHANGED" | grep -Eq '^(frontend/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend or Frontend CI changes detected; skipping Node and Playwright checks."
          fi
      - name: Set up Node 22
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci
      - name: Unit tests
        if: steps.changes.outputs.run == 'true'
        run: npm test
      - name: Typecheck
        if: steps.changes.outputs.run == 'true'
        run: npm run typecheck
      - name: Production build
        if: steps.changes.outputs.run == 'true'
        run: npm run build
      - name: Install Chromium
        if: steps.changes.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: steps.changes.outputs.run == 'true'
        run: npm run test:e2e
      - name: Upload Playwright failures
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
