services:
  postgres:
    image: postgres:16-alpine
    container_name: algolearner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: algolearner
      POSTGRES_USER: algolearner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env or the shell}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algolearner -d algolearner"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: algolearner-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI for viewing OTP emails
    environment:
      MP_MAX_MESSAGES: 500

  redis:
    image: redis:7-alpine
    container_name: algolearner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
