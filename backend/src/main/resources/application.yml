server:
  forward-headers-strategy: framework
spring:
  profiles:
    default: internal-auth
  application:
    name: algolearner-platform
  task:
    scheduling:
      pool:
        size: 4
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: ${FILE_MULTIPART_MAX_SIZE:20MB}
      max-request-size: ${FILE_MULTIPART_MAX_REQUEST_SIZE:21MB}
app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  security:
    jwt-secret: ${JWT_SECRET:}
    otp-hmac-secret: ${OTP_HMAC_SECRET:}
    internal-issuer: ${INTERNAL_JWT_ISSUER:https://algolearner.local}
    admin-bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  storage:
    avatar-directory: ${AVATAR_DIRECTORY:./data/avatars}
    max-bytes: ${AVATAR_MAX_BYTES:5242880}
    max-pixels: ${AVATAR_MAX_PIXELS:16000000}
    allowed-types: ${AVATAR_ALLOWED_TYPES:image/jpeg,image/png}
  judge:
    provider: ${JUDGE_PROVIDER:mock}
    run-limit-per-minute: ${JUDGE_RUN_LIMIT_PER_MINUTE:5}
    recovery-delay-ms: ${JUDGE_RECOVERY_DELAY_MS:30000}
    recovery-batch-size: ${JUDGE_RECOVERY_BATCH_SIZE:20}
    worker:
      core-pool-size: ${JUDGE_WORKER_CORE_POOL_SIZE:2}
      max-pool-size: ${JUDGE_WORKER_MAX_POOL_SIZE:4}
      queue-capacity: ${JUDGE_WORKER_QUEUE_CAPACITY:100}
    docker:
      image-java: ${JUDGE_DOCKER_IMAGE_JAVA:eclipse-temurin:21-alpine}
      image-python: ${JUDGE_DOCKER_IMAGE_PYTHON:python:3.11-alpine}
      command-timeout-seconds: ${JUDGE_DOCKER_COMMAND_TIMEOUT_SECONDS:15}
  files:
    supabase-url: ${SUPABASE_STORAGE_URL:}
    service-key: ${SUPABASE_STORAGE_SERVICE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:learning-private}
    max-bytes: ${FILE_MAX_BYTES:20971520}
    scanner-host: ${FILE_SCANNER_HOST:}
    scanner-port: ${FILE_SCANNER_PORT:3310}
    scanner-timeout-ms: ${FILE_SCANNER_TIMEOUT_MS:30000}
