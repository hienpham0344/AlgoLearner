spring:
  application:
    name: algolearner-platform
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/algolearner}
    username: ${DB_USERNAME:algolearner}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: ${AVATAR_MAX_SIZE:5MB}
      max-request-size: ${AVATAR_MAX_REQUEST_SIZE:6MB}
app:
  auth:
    mail-from: ${AUTH_MAIL_FROM:no-reply@algolearner.local}
    admin:
      email: ${ADMIN_EMAIL:}
      username: ${ADMIN_USERNAME:}
      password-hash: ${ADMIN_PASSWORD_HASH:}
  security:
    jwt:
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      signing-private-key-path: ${JWT_SIGNING_PRIVATE_KEY_PATH:}
  storage:
    avatar-directory: ${AVATAR_DIRECTORY:./data/avatars}
    max-bytes: ${AVATAR_MAX_BYTES:5242880}
    max-pixels: ${AVATAR_MAX_PIXELS:16000000}
    allowed-types: ${AVATAR_ALLOWED_TYPES:image/jpeg,image/png}
